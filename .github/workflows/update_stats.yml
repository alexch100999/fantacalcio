name: Aggiorna statistiche Serie A

# Usa API-Football (api-sports.io), un'API pensata per sviluppatori con un
# piano gratuito — non uno scraper. La chiave va salvata come secret del
# repository (Settings → Secrets and variables → Actions → New repository
# secret) col nome API_FOOTBALL_KEY. Vedi il README per come ottenerla.

on:
  schedule:
    # Ogni martedì alle 06:00 UTC (dopo il turno infrasettimanale/weekend
    # di Serie A). Modifica pure l'orario: https://crontab.guru
    - cron: "0 6 * * 2"
  workflow_dispatch: {}   # permette di lanciarla anche a mano da Actions → Run workflow

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Aggiorna data/players.json
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 scripts/update_stats.py

      - name: Commit e push se ci sono cambiamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/players.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati, salto il commit."
          else
            git commit -m "Aggiornamento automatico statistiche $(date -u +'%Y-%m-%d')"
            git push
          fi
